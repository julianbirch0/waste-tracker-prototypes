<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Rate Card | WasteTracker Prototype</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>Rate Card</h1>
    </header>

    <section class="content" aria-label="Standard Rate Card">
      <div class="toolbar">
        <div class="toolbar-heading">
          <h2>Standard Rates</h2>
          <span id="row-count" class="row-count"></span>
        </div>
        <button type="button" id="add-row" class="btn btn-primary">
          <span class="plus-icon" aria-hidden="true">+</span> Add Rate Card Item
        </button>
      </div>

      <fieldset class="group-visibility">
        <legend>Show additional charge groups</legend>
        <label class="visibility-toggle"><input type="checkbox" data-group-toggle="disposal"> Disposal Charges</label>
        <label class="visibility-toggle"><input type="checkbox" data-group-toggle="rental"> Container Rental</label>
        <label class="visibility-toggle"><input type="checkbox" data-group-toggle="wait"> Wait and Load</label>
      </fieldset>

      <div id="message" class="message" role="status" aria-live="polite" hidden></div>

      <div class="table-scroll" tabindex="0" role="region" aria-label="Rate card table, scroll horizontally to see all columns">
        <table class="rates-table" id="rates-table">
          <colgroup id="rate-cols"></colgroup>
          <thead id="rate-head"></thead>
          <tbody id="rate-rows"></tbody>
        </table>
      </div>

      <div class="footer-bar">
        <div class="footer-left">
          <button type="button" id="reset-data" class="link-button">Reset sample data</button>
          <span class="footer-note">Changes are saved in this browser</span>
        </div>
        <div class="footer-right">
          <span id="dirty-indicator" class="dirty-indicator" aria-live="polite"></span>
          <button type="button" id="cancel" class="btn btn-secondary">Cancel</button>
          <button type="button" id="save" class="btn btn-primary">Save</button>
        </div>
      </div>
      <p class="storage-note">Prototype only. Optional charge groups are hidden by default; your display preferences are saved in this browser. Hidden values are preserved.</p>
    </section>
  </main>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
