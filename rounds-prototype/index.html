<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Round Definitions | WasteTracker Prototype</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Local SVG icons: no fonts, CDNs, or external dependencies required. -->
  <svg class="icon-sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m5 4v6m4-6v6"/></symbol>
    <symbol id="icon-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="icon-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6m0 4h.01"/></symbol>
  </svg>

  <main class="page">
    <header class="page-header">
      <h1>Round Definitions</h1>
    </header>

    <section class="content" aria-labelledby="rounds-heading">
      <div class="toolbar">
        <div class="toolbar-heading">
          <h2 id="rounds-heading">Rounds</h2>
          <span id="round-count" class="round-count"></span>
        </div>
        <button type="button" id="add-round" class="btn btn-primary">
          <svg class="icon" aria-hidden="true"><use href="#icon-plus"></use></svg>
          Add Round
        </button>
      </div>

      <div id="message" class="message" aria-live="polite" role="status" hidden></div>

      <div class="table-scroll" id="table-scroll">
        <table class="rounds-table">
          <colgroup>
            <col class="column-group">
            <col class="column-name">
            <col class="column-days">
            <col class="column-material">
            <col class="column-vehicle">
            <col class="column-facility">
            <col class="column-actions">
          </colgroup>
          <thead>
            <tr>
              <th scope="col">Group</th>
              <th scope="col">Round Name <span class="required">*</span></th>
              <th scope="col">Day of Week <span class="required">*</span></th>
              <th scope="col">Default Material</th>
              <th scope="col">Default Vehicle</th>
              <th scope="col">Default Facility</th>
              <th scope="col" class="actions-heading">Actions</th>
            </tr>
          </thead>
          <tbody id="rounds-body"></tbody>
        </table>
      </div>

      <div class="footer-bar">
        <div class="footer-left">
          <button type="button" id="reset-data" class="link-button">Reset sample data</button>
          <span class="footer-note">Prototype data is stored in this browser</span>
        </div>
        <div class="footer-right">
          <span id="dirty-indicator" class="dirty-indicator" aria-live="polite"></span>
          <button type="button" id="cancel" class="btn btn-secondary">Cancel</button>
          <button type="button" id="save" class="btn btn-primary">Save</button>
        </div>
      </div>
    </section>
  </main>

  <!-- This popover lives outside the scrollable table so it cannot be clipped. -->
  <div id="day-popover" class="day-popover" hidden></div>

  <!-- Intentionally NO modules, fetch, framework, build step or server. -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
