<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Agreements | WasteTracker Prototype</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page agreements-list-page">
    <header class="page-header">
      <div class="page-heading">
        <h1>Agreements</h1>
        <p class="subtitle">Customer service agreements</p>
      </div>
      <div class="header-actions">
        <button type="button" id="new-agreement" class="btn btn-primary">
          <span class="plus-icon" aria-hidden="true">+</span> New agreement
        </button>
      </div>
    </header>

    <div class="agreements-overview" aria-label="Agreement totals">
      <div class="overview-item"><strong id="agreement-count">0</strong><span>Agreements</span></div>
      <div class="overview-item"><strong id="recurring-count">0</strong><span>Recurring services</span></div>
      <div class="overview-item"><strong id="adhoc-count">0</strong><span>Ad hoc services</span></div>
    </div>

    <section class="section" aria-labelledby="agreements-table-heading">
      <div class="section-heading agreements-list-toolbar">
        <h2 id="agreements-table-heading">Existing agreements</h2>
        <div class="agreements-search">
          <label for="agreement-search" class="field-label">Search</label>
          <input id="agreement-search" class="field" type="search" placeholder="Agreement, customer, site, material…" autocomplete="off">
        </div>
      </div>
      <div class="table-wrap">
        <table class="agreements-list-table">
          <thead>
            <tr>
              <th scope="col">Agreement</th>
              <th scope="col">Customer</th>
              <th scope="col">Site</th>
              <th scope="col">Container</th>
              <th scope="col">Material</th>
              <th scope="col">Services</th>
              <th scope="col">Action</th>
            </tr>
          </thead>
          <tbody id="agreements-list-body"></tbody>
        </table>
      </div>
      <p class="agreements-list-footnote" id="list-result-count"></p>
    </section>

    <p class="storage-note">Prototype: Agreement records and changes are stored in this browser. Data is not connected to the live system.</p>
  </main>
  <script src="data.js"></script>
  <script src="agreements-store.js"></script>
  <script src="list.js"></script>
</body>
</html>
